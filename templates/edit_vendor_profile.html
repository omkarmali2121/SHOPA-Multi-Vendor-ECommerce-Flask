{% extends "vendor_base.html" %}

{% block title %}
Edit Vendor Profile | SHOPA
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/edit_vendor_profile.css') }}">
{% endblock %}

{% block content %}
<div class="profile-edit-container">

    <div class="page-header">
        <h1>Edit Vendor Profile</h1>
        <p>Update your store information and branding.</p>
    </div>

    <form action="/vendor/profile/edit" method="POST" enctype="multipart/form-data" class="profile-form">

        <div class="form-card">
            <div class="profile-photo">
                {% if vendor and vendor["logo"] %}
                    <img src="{{ url_for('static', filename='uploads/vendors/' + vendor['logo']) }}" alt="Vendor Logo">
                {% else %}
                    <img src="{{ url_for('static', filename='images/vendor.png') }}" alt="Vendor Logo">
                {% endif %}

                <label class="upload-btn">
                    <i class="fas fa-camera"></i>
                    Change Logo
                    <input type="file" name="logo" hidden>
                </label>
            </div>

            <div class="form-grid">
                <div class="input-box">
                    <label>Store Name</label>
                    <input type="text" name="store_name" value="{{ vendor['store_name'] if vendor else '' }}" required>
                </div>

                <div class="input-box">
                    <label>Owner Name</label>
                    <input type="text" name="owner_name" value="{{ vendor['owner_name'] if vendor else '' }}" required>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ vendor['email'] if vendor else '' }}" required>
                </div>

                <div class="input-box">
                    <label>Mobile</label>
                    <input type="text" name="mobile" value="{{ vendor['mobile'] if vendor else '' }}">
                </div>

                <div class="input-box">
                    <label>GST Number</label>
                    <input type="text" name="gst_number" value="{{ vendor['gst_number'] if vendor else '' }}">
                </div>

                <div class="input-box full-width">
                    <label>Address</label>
                    <textarea name="address" rows="4">{{ vendor['address'] if vendor else '' }}</textarea>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a href="/vendor/profile" class="cancel-btn">Cancel</a>
            <button type="submit" class="save-btn">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
