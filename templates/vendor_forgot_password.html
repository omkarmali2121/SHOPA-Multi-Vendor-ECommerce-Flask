<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Forgot Password | SHOPA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="forgot-box">

        <div class="header">
            <h1>SHOPA</h1>
            <h2>Vendor Forgot Password?</h2>
            <p>Enter your registered vendor email address. We will send you a password reset OTP.</p>
        </div>

        <form action="/vendor/forgot-password" method="POST">

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Enter Your Email" required>
            </div>

            <button type="submit" class="reset-btn">Send OTP</button>

        </form>

        <div class="links">
            <a href="/vendor/login">
                <i class="fas fa-arrow-left"></i>
                Back to Vendor Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
