{% extends "vendor_base.html" %}

{% block title %}
Update Order Status | SHOPA
{% endblock %}

{% block css %}
<link rel="stylesheet"
href="{{ url_for('static',
filename='css/vendor_update_status.css') }}">
{% endblock %}

{% block content %}

<div class="status-card">

    <h1>Update Order Status</h1>

    <p>Order #{{ order["id"] }}</p>

    <form method="POST">

        <div class="form-group">

            <label>Select Status</label>

            <select name="status" required>

                <option value="Pending"
                {% if order["status"]=="Pending" %}selected{% endif %}>
                Pending
                </option>

                <option value="Confirmed"
                {% if order["status"]=="Confirmed" %}selected{% endif %}>
                Confirmed
                </option>

                <option value="Packed"
                {% if order["status"]=="Packed" %}selected{% endif %}>
                Packed
                </option>

                <option value="Shipped"
                {% if order["status"]=="Shipped" %}selected{% endif %}>
                Shipped
                </option>

                <option value="Out For Delivery"
                {% if order["status"]=="Out For Delivery" %}selected{% endif %}>
                Out For Delivery
                </option>

                <option value="Delivered"
                {% if order["status"]=="Delivered" %}selected{% endif %}>
                Delivered
                </option>

                <option value="Cancelled"
                {% if order["status"]=="Cancelled" %}selected{% endif %}>
                Cancelled
                </option>

            </select>

        </div>

        <button type="submit" class="save-btn">

            <i class="fa-solid fa-floppy-disk"></i>

            Update Status

        </button>

    </form>

</div>

{% endblock %}
